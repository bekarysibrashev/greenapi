<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GREEN API · WhatsApp Gateway </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:    #00e676;
      --green-dim:#00c853;
      --dark:     #0a0f0d;
      --surface:  #111a14;
      --card:     #162019;
      --border:   #1f3024;
      --text:     #d4f0da;
      --muted:    #5a7a61;
      --white:    #f0fbf2;
      --error:    #ff5252;
      --radius:   10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,230,118,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,230,118,.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse at center, rgba(0,230,118,.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 48px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 8px 20px;
      margin-bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--green);
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .logo-badge::before {
      content: '';
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100%{ opacity:1; } 50%{ opacity:.2; }
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      color: var(--white);
      line-height: 1.1;
      letter-spacing: -.02em;
    }

    h1 span { color: var(--green); }

    .subtitle {
      margin-top: 12px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }

    /* ── LAYOUT ── */
    .wrapper {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 24px;
      width: 100%;
      max-width: 960px;
      align-items: start;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── INPUTS ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .05em;
    }

    input, textarea {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--white);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 12px 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      width: 100%;
      resize: none;
    }

    input::placeholder, textarea::placeholder { color: var(--muted); }

    input:focus, textarea:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,230,118,.1);
    }

    textarea { min-height: 80px; }

    /* ── DIVIDER ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
    }

    /* ── BUTTON ── */
    button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--green);
      border-radius: var(--radius);
      color: var(--green);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
      transition: background .2s, color .2s, transform .1s, box-shadow .2s;
      width: 100%;
      letter-spacing: .04em;
    }

    button:hover {
      background: var(--green);
      color: var(--dark);
      box-shadow: 0 0 20px rgba(0,230,118,.3);
    }

    button:active { transform: scale(.98); }

    button.loading {
      opacity: .7;
      pointer-events: none;
    }

    button .icon { font-size: 15px; }

    /* ── METHOD GROUPS ── */
    .method-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .method-label {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }

    /* ── RESPONSE PANEL ── */
    .response-panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 560px;
      overflow: hidden;
    }

    .response-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
    }

    .response-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .12em;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .response-method-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      background: rgba(0,230,118,.1);
      color: var(--green);
      padding: 3px 10px;
      border-radius: 50px;
      border: 1px solid rgba(0,230,118,.2);
      transition: all .3s;
    }

    #response-output {
      flex: 1;
      background: var(--surface);
      border: none;
      border-radius: 0 0 16px 16px;
      color: var(--green);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 24px;
      resize: none;
      outline: none;
      line-height: 1.7;
      overflow-y: auto;
    }

    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: none;
      width: 14px; height: 14px;
      border: 2px solid rgba(0,230,118,.3);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    .loading .spinner { display: block; }
    .loading .icon { display: none; }

    /* status dot */
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background .4s;
    }
    .status-dot.ok  { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.err { background: var(--error);  box-shadow: 0 0 6px var(--error); }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      .wrapper { grid-template-columns: 1fr; }
      .response-panel { min-height: 320px; }
    }

    /* fade-in on load */
    .card, .response-panel {
      animation: fadeUp .5s ease both;
    }
    .response-panel { animation-delay: .1s; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo-badge">GREEN-API · WhatsApp Gateway · By BEKARYS IBASHEV</div>
  <h1>Instance <span>Control Panel</span></h1>
  <p class="subtitle">Введите параметры инстанса и вызывайте методы API</p>
</header>

<div class="wrapper">

  <!-- ── LEFT COLUMN ── -->
  <div class="card">
    <span class="card-title">⚙ Подключение</span>

    <div class="field">
      <label>idInstance</label>
      <input id="idInstance" type="text" placeholder="1234567890" />
    </div>

    <div class="field">
      <label>ApiTokenInstance</label>
      <input id="apiToken" type="password" placeholder="••••••••••••••••••••" />
    </div>

    <hr class="divider"/>

    <!-- getSettings -->
    <div class="method-group">
      <span class="method-label">· Instance info</span>
      <button id="btn-getSettings" onclick="callMethod('getSettings')">
        <span class="spinner"></span>
        <span class="icon">⚙</span>
        getSettings
      </button>
      <button id="btn-getStateInstance" onclick="callMethod('getStateInstance')">
        <span class="spinner"></span>
        <span class="icon">📡</span>
        getStateInstance
      </button>
    </div>

    <hr class="divider"/>

    <!-- sendMessage -->
    <div class="method-group">
      <span class="method-label">· Send message</span>
      <div class="field">
        <label>Номер получателя (sendMessage)</label>
        <input id="msg-phone" type="text" placeholder="77771234567" />
      </div>
      <div class="field">
        <label>Текст сообщения</label>
        <textarea id="msg-text" placeholder="Hello World!"></textarea>
      </div>
      <button id="btn-sendMessage" onclick="callMethod('sendMessage')">
        <span class="spinner"></span>
        <span class="icon">💬</span>
        sendMessage
      </button>
    </div>

    <hr class="divider"/>

    <!-- sendFileByUrl -->
    <div class="method-group">
      <span class="method-label">· Send file</span>
      <div class="field">
        <label>Номер получателя (sendFileByUrl)</label>
        <input id="file-phone" type="text" placeholder="77771234567" />
      </div>
      <div class="field">
        <label>URL файла</label>
        <input id="file-url" type="text" placeholder="https://example.com/file.png" />
      </div>
      <div class="field">
        <label>Имя файла</label>
        <input id="file-name" type="text" placeholder="image.png" />
      </div>
      <button id="btn-sendFileByUrl" onclick="callMethod('sendFileByUrl')">
        <span class="spinner"></span>
        <span class="icon">📎</span>
        sendFileByUrl
      </button>
    </div>
  </div>

  <!-- ── RIGHT COLUMN ── -->
  <div class="response-panel">
    <div class="response-header">
      <span class="response-title">
        <span class="status-dot" id="status-dot"></span>
        &nbsp;Ответ API
      </span>
      <span class="response-method-tag" id="method-tag">—</span>
    </div>
    <textarea id="response-output" readonly placeholder="Здесь появится ответ метода…"></textarea>
  </div>

</div>

<script>
  const BASE = 'https://api.green-api.com';

  function getId()   { return document.getElementById('idInstance').value.trim(); }
  function getToken(){ return document.getElementById('apiToken').value.trim(); }

  function setResponse(text, ok, method) {
    const out  = document.getElementById('response-output');
    const dot  = document.getElementById('status-dot');
    const tag  = document.getElementById('method-tag');

    out.value  = text;
    dot.className = 'status-dot ' + (ok ? 'ok' : 'err');
    tag.textContent = method || '—';
  }

  async function callMethod(method) {
    const id    = getId();
    const token = getToken();

    if (!id || !token) {
      setResponse('⚠ Введите idInstance и ApiTokenInstance', false, method);
      return;
    }

    const btn = document.getElementById('btn-' + method);
    btn.classList.add('loading');


    try {
      let url, options = {};

      if (method === 'getSettings') {
        url = `${BASE}/waInstance${id}/getSettings/${token}`;

      } else if (method === 'getStateInstance') {
        url = `${BASE}/waInstance${id}/getStateInstance/${token}`;
      
      } else if (method === 'sendMessage') {
        const phone = document.getElementById('msg-phone').value.trim();
        const text  = document.getElementById('msg-text').value.trim();
        if (!phone || !text) {
          setResponse('⚠ Укажите номер и текст сообщения', false, method);
          btn.classList.remove('loading');
          return;
        }
        url = `${BASE}/waInstance${id}/sendMessage/${token}`;
        options = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: `${phone}@c.us`, message: text })
        };
      } else if (method === 'sendFileByUrl') {
        const phone    = document.getElementById('file-phone').value.trim();
        const fileUrl  = document.getElementById('file-url').value.trim();
        const fileName = document.getElementById('file-name').value.trim() || 'file';
        if (!phone || !fileUrl) {
          setResponse('⚠ Укажите номер и URL файла', false, method);
          btn.classList.remove('loading');
          return;
        }
        url = `${BASE}/waInstance${id}/sendFileByUrl/${token}`;
        options = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chatId: `${phone}@c.us`,
            urlFile: fileUrl,
            fileName: fileName
          })
        };
      }


      const res  = await fetch(url, options);
      const data = await res.json();
      setResponse(JSON.stringify(data, null, 2), res.ok, method);

    } catch (err) {
      setResponse('❌ Ошибка: ' + err.message, false, method);
    } finally {
      btn.classList.remove('loading');
    }
  }
</script>
</body>
</html>
